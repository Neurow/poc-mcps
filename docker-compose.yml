services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - poc-network

  # Un seul token portail (PORTAL_TOKEN), identique pour les trois *-api :
  # il représente l'unique utilisateur fictif du POC. Chaque API le valide
  # indépendamment et émet sa propre session (Service Token) — voir
  # README. Ce token n'est jamais injecté dans les *-mcp : il doit être
  # fourni explicitement par Claude via le tool `authenticate` de chaque MCP.
  ticket-api:
    build: ./services/ticket-api
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/ticket
      PORTAL_TOKEN: demo-portal-token-83f1c2
      AUTH_TOKEN_TTL_SECONDS: "60"
      PORT: "4001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - poc-network

  ticket-mcp:
    build: ./services/ticket-mcp
    environment:
      TICKET_API_URL: http://ticket-api:4001
      PORT: "3101"
    ports:
      - "3101:3101"
    depends_on:
      - ticket-api
    networks:
      - poc-network

  planning-api:
    build: ./services/planning-api
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/planning
      PORTAL_TOKEN: demo-portal-token-83f1c2
      AUTH_TOKEN_TTL_SECONDS: "60"
      PORT: "4002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - poc-network

  planning-mcp:
    build: ./services/planning-mcp
    environment:
      PLANNING_API_URL: http://planning-api:4002
      PORT: "3102"
    ports:
      - "3102:3102"
    depends_on:
      - planning-api
    networks:
      - poc-network

  report-api:
    build: ./services/report-api
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/report
      PORTAL_TOKEN: demo-portal-token-83f1c2
      AUTH_TOKEN_TTL_SECONDS: "60"
      PORT: "4003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - poc-network

  report-mcp:
    build: ./services/report-mcp
    environment:
      REPORT_API_URL: http://report-api:4003
      PORT: "3103"
    ports:
      - "3103:3103"
    depends_on:
      - report-api
    networks:
      - poc-network

  # Mini interfaces de visualisation, une par domaine (Prisma Studio,
  # réutilise l'image *-api existante — pas de service custom pour ça).
  # Opt-in via `docker compose --profile tools up`, pour garder le
  # `docker compose up` de base centré sur l'architecture MCP.
  ticket-studio:
    build: ./services/ticket-api
    command: ["npx", "prisma", "studio", "--port", "5601", "--browser", "none"]
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/ticket
    ports:
      - "5601:5601"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - poc-network
    profiles:
      - tools

  planning-studio:
    build: ./services/planning-api
    command: ["npx", "prisma", "studio", "--port", "5602", "--browser", "none"]
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/planning
    ports:
      - "5602:5602"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - poc-network
    profiles:
      - tools

  report-studio:
    build: ./services/report-api
    command: ["npx", "prisma", "studio", "--port", "5603", "--browser", "none"]
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/report
    ports:
      - "5603:5603"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - poc-network
    profiles:
      - tools

networks:
  poc-network:

volumes:
  pg_data:
