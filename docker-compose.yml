services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: poc
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - poc-network

  # Un seul token portail (PORTAL_TOKEN), identique pour les trois *-api :
  # il représente l'unique utilisateur fictif du POC. Chaque API le valide
  # indépendamment et émet sa propre session (Service Token) — voir
  # README. Ce token n'est jamais injecté dans les *-mcp : il doit être
  # fourni explicitement par Claude via le tool `authenticate` de chaque MCP.
  #
  # Les trois API partagent une seule base Postgres (`poc`) : chacune reste
  # responsable de son domaine (routes/logique), mais elles portent le même
  # schéma Prisma (dupliqué à l'identique dans chaque service) et tapent les
  # mêmes tables, avec de vraies FK entre domaines (ex: PlanningEvent →
  # Ticket) au lieu de références faibles.
  ticket-api:
    build: ./services/ticket-api
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/poc
      PORTAL_TOKEN: demo-portal-token-83f1c2
      AUTH_TOKEN_TTL_SECONDS: "3600"
      PORT: "4001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - poc-network

  ticket-mcp:
    build: ./services/ticket-mcp
    environment:
      TICKET_API_URL: http://ticket-api:4001
      PORTAL_TOKEN_TTL_SECONDS: "14400"
      PORT: "3101"
    ports:
      - "3101:3101"
    depends_on:
      - ticket-api
    networks:
      - poc-network

  # Dépend de ticket-api en `service_healthy` (et non juste `service_started`)
  # uniquement pour sérialiser le tout premier `prisma db push` de chacune :
  # le schéma étant dupliqué à l'identique, celui de ticket-api aura déjà
  # convergé la base quand planning-api lance le sien (no-op), ce qui évite
  # une race DDL si les deux poussaient leur schéma en parallèle.
  planning-api:
    build: ./services/planning-api
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/poc
      PORTAL_TOKEN: demo-portal-token-83f1c2
      AUTH_TOKEN_TTL_SECONDS: "3600"
      PORT: "4002"
    depends_on:
      postgres:
        condition: service_healthy
      ticket-api:
        condition: service_healthy
    networks:
      - poc-network

  planning-mcp:
    build: ./services/planning-mcp
    environment:
      PLANNING_API_URL: http://planning-api:4002
      PORTAL_TOKEN_TTL_SECONDS: "14400"
      PORT: "3102"
    ports:
      - "3102:3102"
    depends_on:
      - planning-api
    networks:
      - poc-network

  report-api:
    build: ./services/report-api
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/poc
      PORTAL_TOKEN: demo-portal-token-83f1c2
      AUTH_TOKEN_TTL_SECONDS: "3600"
      PORT: "4003"
    depends_on:
      postgres:
        condition: service_healthy
      ticket-api:
        condition: service_healthy
    networks:
      - poc-network

  report-mcp:
    build: ./services/report-mcp
    environment:
      REPORT_API_URL: http://report-api:4003
      PORTAL_TOKEN_TTL_SECONDS: "14400"
      PORT: "3103"
    ports:
      - "3103:3103"
    depends_on:
      - report-api
    networks:
      - poc-network

  # Mini interface de visualisation (Prisma Studio, réutilise l'image
  # ticket-api existante — pas de service custom pour ça). Une seule
  # instance suffit : les 3 API partagent la même base `poc`, plus besoin
  # d'un Studio par domaine. Opt-in via `docker compose --profile tools up`,
  # pour garder le `docker compose up` de base centré sur l'architecture MCP.
  studio:
    build: ./services/ticket-api
    command: ["npx", "prisma", "studio", "--port", "5601", "--browser", "none"]
    environment:
      DATABASE_URL: postgresql://poc:poc@postgres:5432/poc
    ports:
      - "5601:5601"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - poc-network
    profiles:
      - tools

networks:
  poc-network:

volumes:
  pg_data:
